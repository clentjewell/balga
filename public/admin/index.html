<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Balga Designs — Content Manager</title>
<style>
  :root{
    --green:#5a674e; --green-d:#49543f; --khaki:#b7b597; --ink:#1b1b1b; --muted:#6b6f63;
    --bg:#f4f3ee; --surface:#fff; --line:#e2e1d8; --danger:#8a2b22; --ok:#33502b; --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:var(--green)}
  button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:.6rem 1rem;background:var(--green);color:#fff;font-weight:600}
  button.secondary{background:#e8e7df;color:var(--ink)}
  button.danger{background:var(--danger)}
  button.link{background:none;color:var(--green);padding:.2rem .3rem}
  button:disabled{opacity:.5;cursor:not-allowed}
  input,textarea,select{font:inherit;width:100%;padding:.6rem .7rem;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  textarea{resize:vertical;min-height:80px}
  label{display:block;font-weight:600;margin:0 0 .3rem;font-size:.92rem}
  .hint{font-weight:400;color:var(--muted);font-size:.82rem;margin:.2rem 0 0}
  .hidden{display:none!important}

  /* Login */
  .login{min-height:100vh;display:grid;place-items:center;padding:1.5rem}
  .login__card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:2rem;max-width:380px;width:100%;box-shadow:0 6px 24px rgba(0,0,0,.06)}
  .login__card h1{font-size:1.3rem;margin:0 0 .3rem}
  .login__card p{color:var(--muted);margin:0 0 1.4rem}
  .field{margin-bottom:1rem}

  /* App shell */
  .app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
  .side{background:var(--green);color:#fff;padding:1.2rem 1rem;display:flex;flex-direction:column;gap:.3rem}
  .side__brand{font-weight:700;font-size:1.1rem;margin:0 0 1.2rem;display:flex;align-items:center;gap:.5rem}
  .side nav button{width:100%;text-align:left;background:transparent;color:rgba(255,255,255,.85);border-radius:8px;padding:.6rem .8rem;font-weight:500}
  .side nav button.active,.side nav button:hover{background:rgba(255,255,255,.14);color:#fff}
  .side__foot{margin-top:auto;font-size:.85rem}
  .side__foot button{background:rgba(255,255,255,.14);width:100%;margin-top:.6rem}
  .main{padding:1.6rem clamp(1rem,3vw,2.4rem);overflow:auto}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.4rem;flex-wrap:wrap}
  .topbar h2{margin:0;font-size:1.4rem}
  .crumb{color:var(--muted);font-size:.9rem;margin-bottom:.2rem}

  .list{display:grid;gap:.6rem}
  .row{display:flex;align-items:center;justify-content:space-between;gap:1rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.8rem 1rem}
  .rowmain{display:flex;align-items:center;gap:.9rem;min-width:0}
  .rowthumb{width:66px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:#eee;flex:0 0 auto}
  .row__t{font-weight:600}
  .row__s{color:var(--muted);font-size:.85rem}

  /* Media library (image picker) */
  .modalbg{position:fixed;inset:0;background:rgba(20,22,18,.55);display:grid;place-items:center;padding:1rem;z-index:80}
  .modal{background:var(--surface);border-radius:var(--radius);width:min(900px,100%);max-height:min(86vh,760px);
         display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal__h{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 1.2rem;border-bottom:1px solid var(--line)}
  .modal__h h3{margin:0;font-size:1.1rem}
  .modal__bar{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;padding:.8rem 1.2rem;border-bottom:1px solid var(--line)}
  .modal__bar input[type=search]{flex:1;min-width:180px}
  .modal__body{padding:1rem 1.2rem;overflow:auto}
  .modal__f{padding:.8rem 1.2rem;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:.6rem;align-items:center}
  .media{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:.7rem}
  .mtile{border:2px solid transparent;border-radius:10px;padding:.3rem;background:#f7f6f1;cursor:pointer;text-align:left;color:inherit;font:inherit;font-weight:400}
  .mtile:hover{border-color:var(--khaki)}
  .mtile[aria-current="true"]{border-color:var(--green);background:#eef0e8}
  .mtile img{width:100%;height:92px;object-fit:cover;border-radius:6px;background:#e7e6de;display:block}
  .mtile__n{font-size:.75rem;color:var(--muted);margin-top:.3rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .uploadbtn{position:relative;overflow:hidden}
  .uploadbtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .imgfield{display:flex;gap:1rem;align-items:flex-start;flex-wrap:wrap}
  .imgfield__meta{display:grid;gap:.5rem}

  /* Dashboard */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:1rem;align-items:start}
  .cards .card{margin:0}
  .card--wide{grid-column:1/-1}
  .card__h{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin:0 0 .8rem;font-size:1.05rem;font-weight:700}
  .card__h .hint{margin:0}
  .stats{display:flex;gap:1.4rem;flex-wrap:wrap;margin-bottom:.8rem}
  .stat__n{font-size:1.7rem;font-weight:700;line-height:1.1}
  .stat__l{color:var(--muted);font-size:.82rem}
  .stat--alert .stat__n{color:var(--danger)}
  .stat--ok .stat__n{color:var(--ok)}
  .clist{display:grid;gap:.1rem;max-height:340px;overflow:auto;margin:0 -.4rem}
  .citem{display:flex;gap:.6rem;align-items:flex-start;padding:.5rem .4rem;border-top:1px solid var(--line);font-size:.9rem}
  .citem:first-child{border-top:0}
  .citem__main{flex:1;min-width:0}
  .citem__t{font-weight:600;overflow-wrap:anywhere}
  .citem__s{color:var(--muted);font-size:.82rem;overflow-wrap:anywhere}
  .citem__act{flex:0 0 auto;display:flex;gap:.3rem}
  .citem__act button{padding:.3rem .5rem;font-size:.8rem}
  .dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--green);margin-top:.45rem}
  .dot--off{background:transparent;border:1px solid var(--line)}
  .pill{flex:0 0 auto;font-size:.75rem;font-weight:600;padding:.15rem .5rem;border-radius:999px;background:#e8e7df;color:var(--muted)}
  .pill--live{background:#e4eede;color:var(--ok)}
  .pill--draft{background:#f6e7c9;color:#7a5a12}
  .empty{color:var(--muted);font-size:.88rem;padding:.4rem 0}

  /* Grouped + drag-to-reorder list */
  .group{margin-bottom:1.6rem}
  .group__h{margin:0 0 .6rem;font-size:1.02rem;font-weight:700;display:flex;align-items:center;gap:.5rem}
  .group__n{font-weight:500;color:var(--muted);font-size:.85rem}
  .zone{display:grid;gap:.6rem;min-height:54px;border-radius:10px}
  .zone--empty{border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:.85rem}
  .row--drag{touch-action:none}
  .row--drag .rowmain{flex:1 1 auto}
  .row--drag .actions{flex:0 0 auto;flex-wrap:nowrap}
  .grip{flex:0 0 auto;width:28px;height:34px;display:grid;place-items:center;cursor:grab;color:var(--muted);
        border-radius:6px;background:#f2f1ea;border:1px solid var(--line);font-size:.95rem;line-height:1;user-select:none;touch-action:none}
  .grip:active{cursor:grabbing}
  .row.dragging{box-shadow:0 10px 26px rgba(0,0,0,.18);opacity:.97;transform:rotate(-.4deg)}
  .dropph{border:2px dashed var(--green);background:rgba(90,103,78,.06);border-radius:10px}
  .savebar{position:sticky;bottom:0;z-index:20;margin-top:1rem;background:var(--surface);border:1px solid var(--line);
           border-radius:10px;padding:.8rem 1rem;display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;box-shadow:0 -4px 18px rgba(0,0,0,.08)}
  .savebar span{font-weight:600}

  .form{max-width:720px;display:grid;gap:1.2rem}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem 1.1rem}
  .card>legend,.card>h3{font-weight:700;margin:0 0 .8rem;padding:0}
  .imgprev{width:150px;height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#eee}
  .checks{display:grid;gap:.4rem;max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:.6rem}
  .listw{display:grid;gap:.5rem}
  .listrow{display:flex;gap:.5rem;align-items:flex-start}
  .listrow>.danger{flex:0 0 auto;padding:.5rem .7rem;line-height:1}
  .checks label{display:flex;gap:.5rem;align-items:center;font-weight:500;margin:0}
  .checks input{width:auto}
  .actions{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center}
  .toast{position:fixed;right:1rem;bottom:1rem;background:var(--ink);color:#fff;padding:.8rem 1.1rem;border-radius:10px;max-width:340px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:50}
  .toast.ok{background:var(--ok)} .toast.err{background:var(--danger)}
  .msg{padding:.7rem .9rem;border-radius:8px;font-size:.9rem;margin-top:.6rem}
  .msg.err{background:#fdecea;color:var(--danger)}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(0,0,0,.2);border-top-color:var(--green);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media(max-width:720px){.app{grid-template-columns:1fr}.side{flex-direction:row;flex-wrap:wrap;align-items:center}.side__brand{width:100%;margin-bottom:.6rem}.side__foot{margin:0}}
</style>
</head>
<body>
<div id="root"></div>

<script>
const API = "/cms-api";
let CONFIG = null, SESSION = null;

const $ = (h) => { const d=document.createElement("div"); d.innerHTML=h.trim(); return d.firstElementChild; };
const el = (t, a={}, kids=[]) => { const e=document.createElement(t); for(const k in a){ if(k==="class")e.className=a[k]; else if(k==="html")e.innerHTML=a[k]; else if(k.startsWith("on"))e.addEventListener(k.slice(2),a[k]); else if(a[k]!=null)e.setAttribute(k,a[k]); } (Array.isArray(kids)?kids:[kids]).forEach(c=>c&&e.append(c.nodeType?c:document.createTextNode(c))); return e; };
function toast(msg, kind){ const t=el("div",{class:"toast "+(kind||"")},msg); document.body.append(t); setTimeout(()=>t.remove(), 3500); }

async function api(path, opts={}){
  const res = await fetch(API+path, { headers:{"Content-Type":"application/json"}, ...opts });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || ("Error "+res.status));
  return data;
}

// ---------- frontmatter (flat) parse/emit ----------
function parseContent(collection, raw){
  if(collection.format==="json"){ const o=JSON.parse(raw||"{}"); return {fields:o, body:""}; }
  // frontmatter
  const m = raw.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
  const fields={}; let body="";
  if(m){ body=m[2].replace(/^\n+/,""); m[1].split("\n").forEach(line=>{ const mm=line.match(/^([A-Za-z0-9_]+):\s*(.*)$/); if(mm){ let v=mm[2].trim(); if(/^-?\d+$/.test(v)) v=Number(v); else v=v.replace(/^"(.*)"$/,"$1").replace(/^'(.*)'$/,"$1"); fields[mm[1]]=v; } }); }
  else body=raw;
  return {fields, body};
}
function emitContent(collection, fields, body){
  if(collection.format==="json") return JSON.stringify(fields, null, 2)+"\n";
  const idf=collection.identifier, bodyf=collection.bodyField;
  const lines = Object.entries(fields).filter(([k])=>k!==idf && k!==bodyf).map(([k,v])=>{
    if(typeof v==="number") return `${k}: ${v}`;
    return `${k}: "${String(v??"").replace(/\\/g,"\\\\").replace(/"/g,'\\"')}"`;
  });
  return `---\n${lines.join("\n")}\n---\n\n${body||""}`;
}

// ---------- render ----------
function render(node){ const r=document.getElementById("root"); r.innerHTML=""; r.append(node); }

function loginView(){
  const err = el("div",{class:"msg err hidden"});
  const email = el("input",{type:"email",placeholder:"you@example.com",autocomplete:"username"});
  const pass = el("input",{type:"password",placeholder:"Password",autocomplete:"current-password"});
  const btn = el("button",{type:"submit"},"Sign in");
  const form = el("form",{onsubmit:async(e)=>{ e.preventDefault(); err.classList.add("hidden"); btn.disabled=true; btn.textContent="Signing in…";
    try{ const r=await api("/login",{method:"POST",body:JSON.stringify({email:email.value,password:pass.value})}); SESSION={email:r.email,role:r.role}; await boot(); }
    catch(ex){ err.textContent=ex.message; err.classList.remove("hidden"); btn.disabled=false; btn.textContent="Sign in"; }
  }},[
    el("div",{class:"field"},[el("label",{},"Email"),email]),
    el("div",{class:"field"},[el("label",{},"Password"),pass]),
    btn, err
  ]);
  const forgot = el("p",{class:"hint",style:"margin-top:1rem"},[
    el("button",{class:"link",type:"button",onclick:()=>forgotView()},"Forgot your password?"),
  ]);
  render(el("div",{class:"login"},[el("div",{class:"login__card"},[
    el("h1",{},"Balga Content Manager"), el("p",{},"Sign in to edit the website."), form, forgot
  ])]));
}

// ---------- forgot password (emails a one-time reset link) ----------
function forgotView(){
  const msg = el("div",{class:"msg err hidden"});
  const ok = el("p",{class:"hint hidden"});
  const email = el("input",{type:"email",placeholder:"you@example.com",autocomplete:"username"});
  const btn = el("button",{type:"submit"},"Email me a reset link");
  const form = el("form",{onsubmit:async(e)=>{
    e.preventDefault(); msg.classList.add("hidden"); btn.disabled=true; btn.innerHTML='<span class="spin"></span> Sending…';
    try{
      const r = await api("/forgot",{method:"POST",body:JSON.stringify({email:email.value})});
      ok.textContent = r.message || "If that email has an account, a reset link is on its way.";
      ok.classList.remove("hidden"); form.querySelector("input").disabled=true;
      btn.textContent="Sent";
    }catch(ex){ msg.textContent=ex.message; msg.classList.remove("hidden"); btn.disabled=false; btn.textContent="Email me a reset link"; }
  }},[
    el("div",{class:"field"},[el("label",{},"Your email"),email]),
    btn, msg, ok,
  ]);
  render(el("div",{class:"login"},[el("div",{class:"login__card"},[
    el("h1",{},"Reset your password"),
    el("p",{},"We'll email you a link to set a new one. It lasts 30 minutes and works once."),
    form,
    el("p",{class:"hint",style:"margin-top:1rem"},[el("button",{class:"link",type:"button",onclick:()=>loginView()},"← Back to sign in")]),
  ])]));
}

// ---------- set a new password from an emailed link ----------
function resetView(token){
  const msg = el("div",{class:"msg err hidden"});
  const nw = el("input",{type:"password",autocomplete:"new-password"});
  const cf = el("input",{type:"password",autocomplete:"new-password"});
  const btn = el("button",{type:"submit"},"Set new password");
  const form = el("form",{onsubmit:async(e)=>{
    e.preventDefault(); msg.classList.add("hidden");
    if(nw.value.length<8){ msg.textContent="Password must be at least 8 characters."; msg.classList.remove("hidden"); return; }
    if(nw.value!==cf.value){ msg.textContent="The two passwords don't match."; msg.classList.remove("hidden"); return; }
    btn.disabled=true; btn.innerHTML='<span class="spin"></span> Saving…';
    try{
      await api("/reset",{method:"POST",body:JSON.stringify({token,newPassword:nw.value})});
      history.replaceState(null,"",location.pathname);
      toast("Password updated — you can sign in now.","ok");
      loginView();
    }catch(ex){ msg.textContent=ex.message; msg.classList.remove("hidden"); btn.disabled=false; btn.textContent="Set new password"; }
  }},[
    el("div",{class:"field"},[el("label",{},"New password"),nw]),
    el("div",{class:"field"},[el("label",{},"Confirm new password"),cf]),
    btn, msg,
  ]);
  render(el("div",{class:"login"},[el("div",{class:"login__card"},[
    el("h1",{},"Choose a new password"), el("p",{},"Pick something at least 8 characters long."), form,
  ])]));
}

function appShell(activeCollection){
  const nav = el("nav",{}, [
    el("button",{class:activeCollection==="__dash"?"active":"",onclick:()=>dashboardView()},"🏠 Dashboard"),
    ...CONFIG.collections.map(c=>el("button",{class:c.name===activeCollection?"active":"",onclick:()=>collectionView(c.name)},c.label)),
  ]);
  const accountBtns = [ el("button",{class:activeCollection==="__account"?"active":"",onclick:()=>accountView()},"👤 My account") ];
  if(SESSION && SESSION.role==="admin") accountBtns.push(el("button",{class:activeCollection==="__users"?"active":"",onclick:()=>usersView()},"🔑 Users"));
  const extra = el("nav",{style:"margin-top:.6rem;border-top:1px solid rgba(255,255,255,.18);padding-top:.6rem"}, accountBtns);
  const who = SESSION ? SESSION.email + (SESSION.role==="admin"?"  ·  admin":"") : "";
  const side = el("aside",{class:"side"},[
    el("div",{class:"side__brand"},[el("span",{},"🌿"),"Balga CMS"]),
    nav, extra,
    el("div",{class:"side__foot"},[ el("div",{},who), el("button",{onclick:async()=>{await api("/logout",{method:"POST"});location.reload();}},"Sign out") ])
  ]);
  const main = el("main",{class:"main",id:"main"});
  render(el("div",{class:"app"},[side,main]));
  return main;
}

// ---------- media library ----------
let mediaCache = null;
async function loadMedia(force){
  if(!force && mediaCache) return mediaCache;
  const {items} = await api("/media");
  mediaCache = items;
  return items;
}
async function uploadImage(file, folder){
  const b64 = await new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(String(fr.result).split(",")[1]); fr.readAsDataURL(file); });
  const up = await api("/upload",{method:"POST",body:JSON.stringify({folder, filename:file.name, dataBase64:b64})});
  mediaCache = null; // the library has a new item
  return up.path;
}

/**
 * Pick an image: the library first (like WordPress), with uploading as one of the
 * options rather than the only one. Resolves with a path, or null if cancelled.
 */
function mediaPicker({ current, folder }){
  return new Promise((resolve)=>{
    let selected = current || null;
    const grid = el("div",{class:"media"}, el("p",{class:"hint"},[el("span",{class:"spin"})," Loading your images…"]));
    const search = el("input",{type:"search",placeholder:"Search images by name or folder…"});
    const status = el("span",{class:"hint"});
    const chooseBtn = el("button",{disabled:selected?null:""},"Use this image");
    const close = (val)=>{ document.removeEventListener("keydown",onKey); bg.remove(); resolve(val); };
    const onKey = (e)=>{ if(e.key==="Escape") close(null); };

    const fileInput = el("input",{type:"file",accept:"image/*"});
    fileInput.addEventListener("change", async()=>{
      const f = fileInput.files[0]; if(!f) return;
      status.innerHTML='<span class="spin"></span> Uploading…';
      try{
        const path = await uploadImage(f, folder);
        status.textContent = "Uploaded ✓";
        selected = path; close(path);
      }catch(ex){ status.textContent=""; toast(ex.message,"err"); }
    });
    const uploadBtn = el("label",{class:"uploadbtn secondary",style:"display:inline-flex;align-items:center;gap:.4rem;background:#e8e7df;color:var(--ink);border-radius:8px;padding:.6rem 1rem;font-weight:600;cursor:pointer"},["⬆ Upload new image", fileInput]);

    const paint = (items)=>{
      grid.innerHTML="";
      if(!items.length){ grid.append(el("p",{class:"empty"},"No images found. Upload one to get started.")); return; }
      items.forEach(m=>{
        const tile = el("button",{class:"mtile",type:"button","aria-current":selected===m.url?"true":"false",title:m.url},[
          el("img",{src:m.url,alt:"",loading:"lazy"}),
          el("div",{class:"mtile__n"},m.name),
        ]);
        tile.addEventListener("click",()=>{
          selected = m.url;
          grid.querySelectorAll(".mtile").forEach(t=>t.setAttribute("aria-current","false"));
          tile.setAttribute("aria-current","true");
          chooseBtn.disabled = false;
        });
        tile.addEventListener("dblclick",()=>close(m.url));
        grid.append(tile);
      });
    };

    let all = [];
    const filter = ()=>{
      const q = search.value.trim().toLowerCase();
      paint(!q ? all : all.filter(m=>(m.name+" "+m.folder).toLowerCase().includes(q)));
    };
    search.addEventListener("input", filter);
    chooseBtn.addEventListener("click",()=>close(selected));

    const modal = el("div",{class:"modal"},[
      el("div",{class:"modal__h"},[ el("h3",{},"Media library"), el("button",{class:"secondary",onclick:()=>close(null)},"✕") ]),
      el("div",{class:"modal__bar"},[ search, uploadBtn, status ]),
      el("div",{class:"modal__body"},[grid]),
      el("div",{class:"modal__f"},[
        el("span",{class:"hint"},"Click an image to select it, or double-click to use it straight away."),
        el("div",{class:"actions"},[ el("button",{class:"secondary",onclick:()=>close(null)},"Cancel"), chooseBtn ]),
      ]),
    ]);
    const bg = el("div",{class:"modalbg",onclick:(e)=>{ if(e.target===bg) close(null); }},[modal]);
    document.body.append(bg);
    document.addEventListener("keydown",onKey);
    search.focus();

    loadMedia().then(items=>{ all=items; filter(); })
      .catch(ex=>{ grid.innerHTML=""; grid.append(el("div",{class:"msg err"},ex.message)); });
  });
}

/** The image form field: preview + "Choose/Change image" + Remove. */
function imageField(current, folder, onChange){
  let value = current || "";
  const prev = el("img",{class:"imgprev",src:value||"",alt:""});
  if(!value) prev.style.visibility="hidden";
  const name = el("div",{class:"hint"}, value ? value.split("/").pop() : "No image chosen");
  const removeBtn = el("button",{class:"secondary",type:"button",onclick:()=>set("")},"Remove");
  const chooseBtn = el("button",{class:"secondary",type:"button",onclick:async()=>{
    const picked = await mediaPicker({ current:value, folder });
    if(picked) set(picked);
  }}, value?"Change image":"Choose image");
  function set(v){
    value = v || "";
    prev.src = value; prev.style.visibility = value ? "visible" : "hidden";
    name.textContent = value ? value.split("/").pop() : "No image chosen";
    chooseBtn.textContent = value ? "Change image" : "Choose image";
    removeBtn.classList.toggle("hidden", !value);
    if(onChange) onChange(value);
  }
  removeBtn.classList.toggle("hidden", !value);
  const node = el("div",{class:"imgfield"},[
    prev,
    el("div",{class:"imgfield__meta"},[ el("div",{class:"actions"},[chooseBtn, removeBtn]), name ]),
  ]);
  return { node, get:()=>value, set };
}

/** "3 minutes ago" / "2 days ago" from an ISO date. */
function ago(iso){
  const t = Date.parse(iso);
  if(!t) return "";
  const s = Math.max(0, (Date.now()-t)/1000);
  if(s<60) return "just now";
  const units=[["minute",60],["hour",3600],["day",86400],["week",604800],["month",2592000],["year",31536000]];
  let label="year", size=31536000;
  for(let i=0;i<units.length;i++){ const next=units[i+1]; if(!next || s<next[1]){ label=units[i][0]; size=units[i][1]; break; } }
  const n=Math.floor(s/size);
  return n+" "+label+(n===1?"":"s")+" ago";
}

/**
 * Turn a recorded change into a line the client recognises, e.g.
 *   "CMS: update testimonial “Jane D.”"  →  "Updated testimonial “Jane D.”"
 * Older entries recorded a file path instead of a name; those are translated too
 * so the feed doesn't show src/data/... to the client.
 */
const PAST_TENSE = { add:"Added", create:"Added", update:"Updated", edit:"Updated", delete:"Deleted",
                     remove:"Deleted", upload:"Uploaded", reorder:"Reordered", publish:"Published", unpublish:"Unpublished" };

function describeChange(message){
  const msg = (message||"").replace(/^CMS:\s*/,"");
  const pub = /^(un)?publish the (.+) page$/.exec(msg);
  if(pub){
    const known = (CONFIG.sitePages||[]).find(p=>p.key===pub[2]);
    return { what: (pub[1]?"Unpublished":"Published")+" the "+((known&&known.label)||pub[2])+" page", where: "" };
  }
  const m = /^([a-z]+)\s+(.+)$/.exec(msg);
  if(!m) return { what: msg || "Change", where: "" };
  const verb = PAST_TENSE[m[1]] || (m[1].charAt(0).toUpperCase()+m[1].slice(1));
  const target = m[2].trim();

  // Modern entries already name the thing ("FAQ “How much…”") — show them as-is.
  if(!/\//.test(target)) return { what: `${verb} ${target}`, where: "" };

  // Legacy entries: a repo path. Translate it into something recognisable.
  const KINDS = [
    [/^src\/data\/faqs\//, "FAQ"], [/^src\/data\/projects\//, "project"],
    [/^src\/data\/services\//, "service"], [/^src\/data\/pricing\//, "pricing package"],
    [/^src\/data\/testimonials\//, "testimonial"], [/^src\/content\/blog\//, "blog post"],
    [/^src\/data\/content\/navigation\.json$/, "the header & footer"],
    [/^src\/data\/content\/settings\.json$/, "the site settings"],
    [/^src\/data\/content\/sections\.json$/, "the shared sections"],
    [/^src\/data\/content\/page-status\.json$/, "a page's status"],
    [/^public\/assets\//, "an image"],
  ];
  const name = target.split("/").pop().replace(/\.(json|md|jpe?g|png|webp|svg)$/i,"");
  const pageMatch = /^src\/data\/content\/([a-z-]+)\.json$/.exec(target);
  const known = pageMatch && (CONFIG.sitePages||[]).find(p=>p.key===pageMatch[1]);
  if(known) return { what: `${verb} the ${known.label} page`, where: "" };
  if(pageMatch) return { what: `${verb} a page`, where: name };
  const kind = (KINDS.find(([re])=>re.test(target))||[null,"content"])[1];
  return { what: `${verb} ${kind}`, where: name };
}

async function loadEnquiriesCard(card){
  try{
    const data = await api("/enquiries");
    const render=()=>{
      const list = el("div",{class:"clist"});
      if(!data.items.length) list.append(el("p",{class:"empty"},"No enquiries yet. Messages sent through the website's contact form land here."));
      data.items.slice(0,12).forEach(e=>{
        const body = el("div",{class:"citem__s hidden"});
        const open = async()=>{
          if(body.dataset.loaded){ body.classList.toggle("hidden"); return; }
          try{
            const full = await api("/enquiries?id="+encodeURIComponent(e.id));
            body.textContent = full.enquiry.message;
            body.dataset.loaded="1"; body.classList.remove("hidden");
            if(!e.read){ await api("/enquiries/read",{method:"POST",body:JSON.stringify({id:e.id,read:true})}); loadEnquiriesCard(card); }
          }catch(ex){ toast(ex.message,"err"); }
        };
        const row = el("div",{class:"citem"},[
          el("span",{class:"dot"+(e.read?" dot--off":"")}),
          el("div",{class:"citem__main"},[
            el("div",{class:"citem__t"}, (e.name||"(no name)")+(e.read?"":" · new")),
            el("div",{class:"citem__s"}, (e.email||"")+" · "+ago(e.at)),
            el("div",{class:"citem__s"}, e.preview||""),
            body,
          ]),
          el("div",{class:"citem__act"},[
            el("button",{class:"secondary",onclick:open},"Read"),
            el("button",{class:"danger",onclick:async()=>{
              if(!confirm("Delete this enquiry? This cannot be undone.")) return;
              try{ await api("/enquiries",{method:"DELETE",body:JSON.stringify({id:e.id})}); loadEnquiriesCard(card); }
              catch(ex){ toast(ex.message,"err"); }
            }},"Delete"),
          ]),
        ]);
        list.append(row);
      });
      card.set(
        el("div",{class:"stats"},[
          stat(data.total,"total"),
          stat(data.unread,"unread", data.unread?"stat--alert":null),
          stat(data.read,"read"),
        ]),
        list,
      );
    };
    render();
  }catch(ex){
    card.set(el("p",{class:"empty"}, ex.message.includes("not configured")
      ? "The enquiry inbox isn't switched on for this deployment yet."
      : ex.message));
  }
}

async function loadLinksCard(card){
  let report;
  try{
    const res = await fetch("/_cms/link-report.json",{cache:"no-store"});
    if(!res.ok) throw new Error("no report");
    report = await res.json();
  }catch{
    card.set(el("p",{class:"empty"},"No link check yet — one runs automatically with the next publish."));
    return;
  }
  const unpublished = report.toUnpublished || [];
  const broken = [
    ...report.internalBroken.map(b=>({ t:b.href, s:"on "+b.page })),
    ...report.externalBroken.map(b=>({ t:b.url, s:"HTTP "+b.status+" · on "+b.pages.length+" page"+(b.pages.length===1?"":"s") })),
    ...unpublished.map(b=>({ t:b.href, s:"points at a page you've unpublished · on "+b.page })),
  ];
  const list = el("div",{class:"clist"});
  if(!broken.length) list.append(el("p",{class:"empty"},"No broken links found. 🎉"));
  broken.slice(0,12).forEach(b=> list.append(el("div",{class:"citem"},[
    el("div",{class:"citem__main"},[ el("div",{class:"citem__t"},b.t), el("div",{class:"citem__s"},b.s) ])
  ])));
  if(broken.length>12) list.append(el("p",{class:"hint"},"+ "+(broken.length-12)+" more"));
  const extras = [];
  if(report.unreachable.length) extras.push(report.unreachable.length+" link(s) didn't respond");
  if(report.blocked && report.blocked.length) extras.push(report.blocked.length+" blocked automated checks (not broken)");
  card.set(
    el("div",{class:"stats"},[
      stat(broken.length,"broken", broken.length?"stat--alert":"stat--ok"),
      stat(report.checkedLinks,"links checked"),
      stat(report.checkedPages,"pages"),
    ]),
    list,
    el("p",{class:"hint"}, "Checked "+ago(report.generatedAt)+(extras.length? " · "+extras.join(" · "):"")),
  );
}

function getCol(name){ return CONFIG.collections.find(c=>c.name===name); }

// ---------- collection items (loaded once, then cached) ----------
const itemsCache = {}; // collectionName -> [{ ...file, id, fields, body, title, order }]
function invalidate(name){ delete itemsCache[name]; }

async function loadItems(col){
  if(itemsCache[col.name]) return itemsCache[col.name];
  const {items} = await api("/list?folder="+encodeURIComponent(col.folder));
  const out = await Promise.all(items.map(async(it)=>{
    let fields={}, body="";
    try{ const f=await api("/file?path="+encodeURIComponent(it.path)); const p=parseContent(col,f.content); fields=p.fields; body=p.body; }catch{}
    const ord = Number(fields[col.sortField]);
    return { ...it, id: it.name.replace(/\.(json|md)$/,""), fields, body,
             title: fields[col.summaryField] || it.name,
             order: Number.isFinite(ord) ? ord : 999,
             thumb: col.thumbField ? fields[col.thumbField] : null };
  }));
  out.sort((a,b)=>a.order-b.order);
  itemsCache[col.name]=out;
  return out;
}

/** The groups an orderable collection is split into, in display order. */
function groupNames(col, items){
  const f=(col.fields||[]).find(x=>x.name===col.groupField);
  const names = (f && Array.isArray(f.options)) ? f.options.slice() : [];
  const seen = new Set(names);
  items.forEach(it=>{ const g=it.fields[col.groupField]; if(g && !seen.has(g)){ names.push(g); seen.add(g); } });
  return names;
}

function itemRow(col, it, drag){
  return el("div",{class:"row"+(drag?" row--drag":""),"data-path":it.path},[
    el("div",{class:"rowmain"},[
      drag ? el("span",{class:"grip",title:"Drag to reorder","aria-hidden":"true"},"⠿") : null,
      (it.thumb? el("img",{class:"rowthumb",src:it.thumb,alt:"",loading:"lazy"}):null),
      el("div",{},[el("div",{class:"row__t"},it.title), drag?null:el("div",{class:"row__s"},it.id)])
    ]),
    el("div",{class:"actions"},[
      el("button",{class:"secondary",onclick:()=>editorView(col.name,it)},"Edit"),
      col.delete?el("button",{class:"danger",onclick:()=>del(col,it)},"Delete"):null
    ])
  ]);
}

// ---------- grouped list with drag-and-drop ordering ----------
function sortableList(col, listEl, items){
  const byPath={}; items.forEach(it=>byPath[it.path]=it);
  const grouped = !!col.groupField;
  const wrap = el("div",{});
  const cats = grouped ? groupNames(col, items) : [""];

  cats.forEach(cat=>{
    const zone = el("div",{class:"zone","data-cat":cat});
    items.filter(it=> !grouped || (it.fields[col.groupField]||"")===cat).forEach(it=> zone.append(itemRow(col,it,true)));
    if(grouped){
      const count = zone.children.length;
      wrap.append(el("div",{class:"group"},[
        el("h3",{class:"group__h"},[cat, el("span",{class:"group__n"}, count+" "+(count===1?(col.labelSingular||"item"):(col.label||"items")))]),
        zone
      ]));
    } else wrap.append(zone);
  });
  listEl.append(wrap);

  const bar = el("div",{class:"savebar hidden"});
  const saveBtn = el("button",{},"Save new order");
  const undoBtn = el("button",{class:"secondary"},"Undo");
  bar.append(el("span",{},"Order changed — not published yet."), saveBtn, undoBtn);
  listEl.append(bar);
  undoBtn.addEventListener("click",()=>collectionView(col.name));

  const refresh=()=>{
    wrap.querySelectorAll(".zone").forEach(z=>{
      const empty = !z.querySelector(".row, .dropph");
      z.classList.toggle("zone--empty", empty);
      const hint=z.querySelector(".zonehint");
      if(empty && !hint) z.append(el("div",{class:"zonehint"},"Drag here"));
      if(!empty && hint) hint.remove();
    });
    // group counts
    wrap.querySelectorAll(".group").forEach(g=>{
      const n=g.querySelectorAll(".zone > .row").length;
      const badge=g.querySelector(".group__n");
      if(badge) badge.textContent = n+" "+(n===1?(col.labelSingular||"item"):(col.label||"items"));
    });
  };
  const onDrop=()=>{
    refresh();
    bar.classList.toggle("hidden", !plan().length);
  };
  const plan=()=>{
    const out=[]; let n=1;
    wrap.querySelectorAll(".zone").forEach(z=>{
      const cat=z.getAttribute("data-cat");
      z.querySelectorAll(":scope > .row[data-path]").forEach(r=>{
        const it=byPath[r.getAttribute("data-path")];
        if(it) out.push({ it, order:n++, cat });
      });
    });
    return out.filter(p=> p.it.order!==p.order || (grouped && (p.it.fields[col.groupField]||"")!==p.cat));
  };

  wrap.querySelectorAll(".grip").forEach(g=>{
    g.addEventListener("pointerdown", e=>startDrag(e, g.closest(".row"), wrap, onDrop));
  });
  refresh();

  saveBtn.addEventListener("click", async()=>{
    const changes=plan();
    if(!changes.length){ bar.classList.add("hidden"); return; }
    saveBtn.disabled=undoBtn.disabled=true; saveBtn.innerHTML='<span class="spin"></span> Saving…';
    const files = changes.map(p=>{
      const fields={...p.it.fields};
      fields[col.sortField]=p.order;
      if(grouped) fields[col.groupField]=p.cat;
      if(col.bodyField) delete fields[col.bodyField];
      return { path:p.it.path, content: emitContent(col, fields, p.it.body) };
    });
    try{
      await api("/files",{method:"PUT",body:JSON.stringify({files, message:`CMS: reorder ${col.label}`})});
      toast("New order saved — the site will update in ~1–2 minutes.","ok");
      invalidate(col.name);
      collectionView(col.name);
    }catch(ex){
      toast(ex.message,"err");
      saveBtn.disabled=undoBtn.disabled=false; saveBtn.textContent="Save new order";
    }
  });
}

/** Pointer-based dragging — works with a mouse and with touch. */
function startDrag(e, row, wrap, onDrop){
  if(!row || (e.button!=null && e.button!==0)) return;
  e.preventDefault();
  const rect=row.getBoundingClientRect();
  const offX=e.clientX-rect.left, offY=e.clientY-rect.top;
  const ph=el("div",{class:"dropph"}); ph.style.height=rect.height+"px";
  row.parentNode.insertBefore(ph,row);
  row.classList.add("dragging");
  Object.assign(row.style,{position:"fixed",zIndex:"60",width:rect.width+"px",
    left:rect.left+"px",top:rect.top+"px",pointerEvents:"none",margin:"0"});
  // float the row on <body> so its old group reads as empty and can be dropped back into
  document.body.append(row);
  const scroller=document.getElementById("main")||document.scrollingElement;

  const move=(ev)=>{
    row.style.left=(ev.clientX-offX)+"px";
    row.style.top=(ev.clientY-offY)+"px";
    // auto-scroll near the top/bottom edge
    if(scroller){
      const s=scroller.getBoundingClientRect ? scroller.getBoundingClientRect() : {top:0,bottom:innerHeight};
      if(ev.clientY < s.top+70) scroller.scrollTop -= 14;
      else if(ev.clientY > s.bottom-70) scroller.scrollTop += 14;
    }
    const under=document.elementFromPoint(ev.clientX, ev.clientY);
    if(!under || !under.closest) return;
    const overRow=under.closest(".row[data-path]");
    if(overRow && overRow!==row && wrap.contains(overRow)){
      const r=overRow.getBoundingClientRect();
      const before = ev.clientY < r.top + r.height/2;
      overRow.parentNode.insertBefore(ph, before?overRow:overRow.nextSibling);
      return;
    }
    const zone=under.closest(".zone");
    if(zone && wrap.contains(zone) && !zone.contains(ph) && !zone.querySelector(".row")) zone.append(ph);
  };
  const up=()=>{
    document.removeEventListener("pointermove",move);
    document.removeEventListener("pointerup",up);
    document.removeEventListener("pointercancel",up);
    row.classList.remove("dragging");
    row.removeAttribute("style");
    ph.parentNode.insertBefore(row, ph);
    ph.remove();
    onDrop();
  };
  document.addEventListener("pointermove",move);
  document.addEventListener("pointerup",up);
  document.addEventListener("pointercancel",up);
}

async function del(col,it){
  if(!confirm(`Delete "${it.title||it.name}"? This cannot be undone.`)) return;
  const message = `CMS: delete ${lowerLabel(shortLabel(col.labelSingular||col.label))}${quoteTitle(it.title)}`;
  try{ await api("/file",{method:"DELETE",body:JSON.stringify({path:it.path,sha:it.sha,message})}); toast("Deleted — publishing…","ok"); invalidate(col.name); collectionView(col.name); }
  catch(ex){ toast(ex.message,"err"); }
}

async function loadRelation(name){
  const items = await loadItems(getCol(name));
  return items.map(it=>({ id:it.id, title:it.title }));
}

/**
 * What to record for a change. These strings are what the client reads on the
 * dashboard ("Updated testimonial “Jane D.”"), so they're written for them, not
 * as file paths.
 */
const shortLabel = (label) => String(label||"item").split(" (")[0];
// "Testimonial" → "testimonial" mid-sentence, but leave FAQ (and other acronyms) alone.
const lowerLabel = (label) => /^[A-Z][a-z]/.test(label) ? label.charAt(0).toLowerCase()+label.slice(1) : label;
const quoteTitle = (s) => { const t=String(s||"").replace(/\s+/g," ").trim(); return t? " “"+(t.length>60? t.slice(0,57)+"…" : t)+"”" : ""; };
function changeMessage(spec, values, isNew){
  if(spec.isFile) return `CMS: update ${shortLabel(spec.label)}`;
  const what = lowerLabel(shortLabel(spec.label));
  return `CMS: ${isNew?"add":"update"} ${what}${quoteTitle(values[spec.summaryField])}`;
}

/** Next free auto ID for a collection, e.g. faq-16. */
function nextId(col, items){
  const cfg = (col.autoId && typeof col.autoId==="object") ? col.autoId : {};
  const prefix = cfg.prefix || (col.name.replace(/s$/,"")+"-");
  const pad = cfg.pad || 2;
  const re = new RegExp("^"+prefix.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(\\d+)$");
  const taken = new Set(items.map(it=>it.id));
  let max=0;
  items.forEach(it=>{ const m=re.exec(it.id); if(m) max=Math.max(max, parseInt(m[1],10)); });
  let n=max+1, id;
  do{ id = prefix + String(n).padStart(pad,"0"); n++; }while(taken.has(id));
  return id;
}
/** Next order value — new items go to the end of the list. */
function nextOrder(items){
  return items.reduce((m,it)=>Math.max(m, Number.isFinite(it.order)?it.order:0), 0) + 1;
}

async function editorView(name, item, fileEntry){
  const col=getCol(name);
  const spec = fileEntry
    ? { fields:fileEntry.fields, format:fileEntry.format||"json", extension:"json", bodyField:fileEntry.bodyField,
        mediaFolder:fileEntry.mediaFolder||col.mediaFolder||"public/assets/uploads", identifier:null,
        summaryField:null, folder:null, isFile:true, path:fileEntry.path, label:fileEntry.label }
    : { fields:col.fields, format:col.format, extension:col.extension, bodyField:col.bodyField,
        mediaFolder:col.mediaFolder, identifier:col.identifier, summaryField:col.summaryField,
        folder:col.folder, isFile:false, path:item?item.path:null, label:col.labelSingular };
  const main=appShell(name);
  main.append(el("div",{class:"crumb"},col.label+" ›"));
  const isNew = !spec.isFile && !item;
  let fields={}, body="", sha=null, path=spec.path;
  if(spec.isFile || item){ try{ const f=await api("/file?path="+encodeURIComponent(spec.path)); const p=parseContent(spec,f.content); fields=p.fields; body=p.body; sha=f.sha; }catch(ex){ main.append(el("div",{class:"msg err"},ex.message)); return; } }

  const top=el("div",{class:"topbar"},[ el("h2",{},isNew?("New "+(spec.label||"item")):(spec.isFile?spec.label:(fields[spec.summaryField]||"Edit"))), el("button",{class:"secondary",onclick:()=>collectionView(name)},"← Back") ]);
  main.append(top);

  // Hidden bookkeeping fields (ID / order) are filled in automatically for new
  // items: the next free ID, and an order that puts the item last.
  const auto={};
  if(isNew && !spec.isFile && (col.autoId || col.autoOrder)){
    try{
      const existing = await loadItems(col);
      if(col.autoId && spec.identifier) auto[spec.identifier] = nextId(col, existing);
      if(col.autoOrder && col.sortField) auto[col.sortField] = nextOrder(existing);
    }catch(ex){ main.append(el("div",{class:"msg err"},"Could not load the existing items: "+ex.message)); return; }
  }

  const form=el("form",{class:"form",onsubmit:(e)=>e.preventDefault()});
  const getVal={}; // name -> fn returning value

  for(const f of spec.fields){
    const cur = fields[f.name];
    if(f.hidden){
      getVal[f.name]=()=>{
        if(cur!==undefined && cur!=="") return cur;
        if(auto[f.name]!==undefined) return auto[f.name];
        return f.default!==undefined ? f.default : "";
      };
      continue;
    }
    const wrap=el("div",{});
    const idAttr="f_"+f.name;
    if(f.widget!=="object") wrap.append(el("label",{for:idAttr},f.label+(f.required?" *":"")));

    if(f.widget==="slug"){
      const inp=el("input",{id:idAttr,value:cur??(isNew?"":""),readonly:(f.readonly||(!isNew&&f.name===spec.identifier))?"":null});
      if(!isNew) inp.readOnly=true;
      wrap.append(inp); getVal[f.name]=()=>inp.value.trim().toLowerCase().replace(/[^a-z0-9-]+/g,"-").replace(/^-+|-+$/g,"");
    }
    else if(f.widget==="number"){ const inp=el("input",{id:idAttr,type:"number",value:cur??(f.default??"")}); wrap.append(inp); getVal[f.name]=()=>inp.value===""?undefined:Number(inp.value); }
    else if(f.widget==="text"||f.widget==="markdown"){ const ta=el("textarea",{id:idAttr,rows:f.widget==="markdown"?16:3},cur??""); wrap.append(ta); getVal[f.name]=()=>ta.value; }
    else if(f.widget==="image"){
      const field = imageField(cur, spec.mediaFolder);
      wrap.append(field.node);
      getVal[f.name]=()=>field.get();
    }
    else if(f.widget==="relation"){
      const box=el("div",{class:"checks"},[el("span",{class:"hint"},[el("span",{class:"spin"})," Loading projects…"])]);
      wrap.append(box);
      const selected = new Set(Array.isArray(cur)?cur:(cur?[cur]:[]));
      loadRelation(f.collection).then(opts=>{ box.innerHTML="";
        opts.forEach(o=>{ const inp=el("input",{type:f.multiple?"checkbox":"radio",name:idAttr,value:o.id}); if(selected.has(o.id))inp.checked=true; box.append(el("label",{},[inp," "+o.title+"  ("+o.id+")"])); });
        if(!f.multiple){ const none=el("label",{},[el("input",{type:"radio",name:idAttr,value:"",checked:selected.size?null:""})," — none —"]); box.prepend(none); }
      });
      getVal[f.name]=()=>{ const checked=[...box.querySelectorAll("input:checked")].map(i=>i.value).filter(Boolean); return f.multiple?checked:(checked[0]||""); };
    }
    else if(f.widget==="object"){
      const fs=el("fieldset",{class:"card"},[el("legend",{},f.label)]);
      const subVal={};
      const objCur=cur||{};
      for(const sf of f.fields){
        const sw=el("div",{style:"margin-bottom:.9rem"},[el("label",{},sf.label+(sf.required?" *":""))]);
        if(sf.widget==="text"){ const ta=el("textarea",{rows:3},objCur[sf.name]??""); sw.append(ta); subVal[sf.name]=()=>ta.value; }
        else { const inp=el("input",{value:objCur[sf.name]??""}); sw.append(inp); subVal[sf.name]=()=>inp.value; }
        fs.append(sw);
      }
      wrap.append(fs); getVal[f.name]=()=>{ const o={}; for(const k in subVal)o[k]=subVal[k](); return o; };
    }
    else if(f.widget==="select"){
      const sel=el("select",{id:idAttr}); (f.options||[]).forEach(o=>{ const opt=el("option",{value:o},o); if(cur===o)opt.selected=true; sel.append(opt); });
      wrap.append(sel); getVal[f.name]=()=>sel.value;
    }
    else if(f.widget==="list"){
      const listWrap=el("div",{class:"listw"});
      const rowVals=[];
      const mkRow=(val)=>{
        const my=rowVals.length; let getter;
        const row=el("div",{class:"listrow"});
        if(f.fields){
          const sub={}; const fs=el("div",{class:"card",style:"flex:1"});
          for(const sf of f.fields){
            const sw=el("div",{style:"margin-bottom:.6rem"},[el("label",{},sf.label)]);
            if(sf.widget==="text"){ const ta=el("textarea",{rows:2},(val&&val[sf.name])||""); sw.append(ta); sub[sf.name]=()=>ta.value; }
            else if(sf.widget==="image"){ const field=imageField((val&&val[sf.name])||"", spec.mediaFolder); sw.append(field.node); sub[sf.name]=()=>field.get(); }
            else { const inp=el("input",{value:(val&&val[sf.name])||""}); sw.append(inp); sub[sf.name]=()=>inp.value; }
            fs.append(sw);
          }
          row.append(fs); getter=()=>{ const o={}; let has=false; for(const k in sub){o[k]=sub[k](); if(o[k])has=true;} return has?o:null; };
        } else {
          const iw=f.itemWidget||"string";
          const inp = iw==="text"? el("textarea",{rows:2}, val||"") : el("input",{value:val||""});
          inp.style.flex="1"; row.append(inp); getter=()=>inp.value;
        }
        row.append(el("button",{class:"danger",type:"button",title:"Remove",onclick:()=>{ row.remove(); rowVals[my]=null; }},"×"));
        rowVals.push(getter); listWrap.append(row);
      };
      (Array.isArray(cur)?cur:[]).forEach(mkRow);
      if(!(Array.isArray(cur)&&cur.length)) mkRow(f.fields?null:"");
      wrap.append(listWrap, el("button",{class:"secondary",type:"button",style:"margin-top:.4rem",onclick:()=>mkRow(f.fields?null:"")}, "+ Add "+(f.addLabel||"item")));
      getVal[f.name]=()=> rowVals.map(g=>g&&g()).filter(v=>v!==null&&v!==undefined&&v!=="");
    }
    else { const inp=el("input",{id:idAttr,value:cur??""}); wrap.append(inp); getVal[f.name]=()=>inp.value; }

    if(f.hint) wrap.append(el("p",{class:"hint"},f.hint));
    form.append(wrap);
  }

  const msg=el("div",{class:"msg err hidden"});
  const saveBtn=el("button",{onclick:save},"Save & publish");
  form.append(el("div",{class:"actions"},[saveBtn, el("button",{class:"secondary",type:"button",onclick:()=>collectionView(name)},"Cancel"), msg]));
  main.append(form);

  async function save(){
    msg.classList.add("hidden");
    const out={}; for(const f of spec.fields){ if(f.widget==="markdown"&&f.name===spec.bodyField) continue; out[f.name]=getVal[f.name](); }
    // validate required
    for(const f of spec.fields){ if(f.required){ const v=out[f.name]; if(v===undefined||v===""||(Array.isArray(v)&&!v.length)){ msg.textContent="Please fill in: "+f.label; msg.classList.remove("hidden"); return; } } }
    let targetPath;
    if(spec.isFile){ targetPath=spec.path; }
    else {
      const idVal=getVal[spec.identifier]();
      if(!idVal){
        const idField=spec.fields.find(f=>f.name===spec.identifier);
        msg.textContent = idField && idField.hidden
          ? "Couldn't work out the next ID — please go back and try again."
          : "Please provide an ID / slug.";
        msg.classList.remove("hidden"); return;
      }
      targetPath = isNew ? `${spec.folder}/${idVal}.${spec.extension}` : path;
    }
    const bodyVal = spec.bodyField ? getVal[spec.bodyField]() : "";
    // build fields object for serialization (exclude body for frontmatter handled in emit)
    const fieldsOut={...out};
    if(spec.bodyField) delete fieldsOut[spec.bodyField];
    const content=emitContent(spec, fieldsOut, bodyVal);
    saveBtn.disabled=true; saveBtn.innerHTML='<span class="spin"></span> Saving…';
    try{
      await api("/file",{method:"PUT",body:JSON.stringify({path:targetPath, content, sha:isNew?undefined:sha, message:changeMessage(spec, out, isNew)})});
      toast("Saved — the site will update in ~1–2 minutes.","ok");
      invalidate(name);
      collectionView(name);
    }catch(ex){ msg.textContent=ex.message; msg.classList.remove("hidden"); saveBtn.disabled=false; saveBtn.textContent="Save & publish"; }
  }
}

async function boot(){
  try{ CONFIG = await (await fetch("/cms-config.json",{cache:"no-store"})).json(); }
  catch{ render(el("div",{class:"login"},el("div",{class:"login__card"},"Could not load CMS config."))); return; }
  // Arriving from a "reset your password" email.
  const reset = /[#&]reset=([^&]+)/.exec(location.hash);
  if(reset){ resetView(decodeURIComponent(reset[1])); return; }
  try{ const me=await api("/me"); SESSION={email:me.email,role:me.role}; dashboardView(); }
  catch{ loginView(); }
}
// A reset link pasted into an already-open tab changes the hash without reloading.
window.addEventListener("hashchange",()=>{
  const m = /[#&]reset=([^&]+)/.exec(location.hash);
  if(m) resetView(decodeURIComponent(m[1]));
});
boot();
</script>
